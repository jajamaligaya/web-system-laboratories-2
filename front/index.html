<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2 class="head ms-2">Workout</h2>
    </header>
    
    <div class="container mt-5 pt-5">
        <h1>Workout Tracker</h1>

        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addWorkoutModal">Add New Workout</button>

        <h3>Workouts</h3>
        <ul id="workoutList" class="list-group">
        </ul>
    </div>

    <div class="modal fade" id="addWorkoutModal" tabindex="-1" aria-labelledby="addWorkoutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addWorkoutModalLabel">Add New Workout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addWorkoutForm">
                        <div class="mb-3">
                            <label for="workoutTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="workoutTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="workoutReps" class="form-label">Reps</label>
                            <input type="number" class="form-control" id="workoutReps" required>
                        </div>
                        <div class="mb-3">
                            <label for="workoutLoad" class="form-label">Load</label>
                            <input type="number" class="form-control" id="workoutLoad" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Workout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editWorkoutModal" tabindex="-1" aria-labelledby="editWorkoutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editWorkoutModalLabel">Edit Workout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editWorkoutForm">
                        <input type="hidden" id="editWorkoutId">
                        <div class="mb-3">
                            <label for="editWorkoutTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="editWorkoutTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="editWorkoutReps" class="form-label">Reps</label>
                            <input type="number" class="form-control" id="editWorkoutReps" required>
                        </div>
                        <div class="mb-3">
                            <label for="editWorkoutLoad" class="form-label">Load</label>
                            <input type="number" class="form-control" id="editWorkoutLoad" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Workout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="fetch-data.js"></script>
</body>
</html>
